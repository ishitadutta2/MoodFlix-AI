{% extends "base.html" %}
{% block title %}Forgot Password — MoodFlix AI{% endblock %}
{% block page_css %}<link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">{% endblock %}

{% block body %}
<div class="auth-page">
  <div class="orb" style="width:380px;height:380px;top:-100px;left:-100px;"></div>
  <div class="orb" style="width:340px;height:340px;bottom:-140px;right:-100px;opacity:.35;"></div>

  <div class="auth-wrap">
    <div class="auth-brand">
      <div class="flex items-center gap-2">
        <div style="width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--primary),var(--accent));display:flex;align-items:center;justify-content:center;"><i data-lucide="sparkles" class="icon" style="color:#fff"></i></div>
        <span style="font-family:'Sora',sans-serif;font-weight:700;font-size:18px;">MoodFlix <span class="gradient-text">AI</span></span>
      </div>
    </div>

    <div class="auth-card glass">
      <h1>Reset your password</h1>
      <p>Enter your email and we'll send you a reset link.</p>

      <form id="forgot-password-form" class="auth-form">
        <div class="field">
          <label for="email">Email</label>
          <input class="input" type="email" id="email" placeholder="you@example.com" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Send reset link</button>
        <p id="forgot-password-msg" class="form-msg"></p>
      </form>

      <p class="auth-switch"><a href="{{ url_for('page_routes.login') }}">Back to login</a></p>
    </div>
  </div>
</div>
{% endblock %}

{% block page_js %}<script src="{{ url_for('static', filename='js/forgot_password.js') }}" defer></script>{% endblock %}
